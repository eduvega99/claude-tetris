name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Analyze and triage issue
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Analiza el issue #${{ github.event.issue.number }} de este repositorio
            (título y descripción) usando el contexto del código en game.js,
            index.html y style.css (ver CLAUDE.md para la arquitectura del proyecto).

            1. Ejecuta `gh label list` para ver las labels disponibles y asigna
               solo las que correspondan (`gh issue edit ${{ github.event.issue.number }} --add-label "..."`).
               No crees labels nuevas.
            2. Publica un comentario de diagnóstico
               (`gh issue comment ${{ github.event.issue.number }} --body "..."`) que incluya:
               - Un resumen breve del problema/solicitud.
               - Los archivos y funciones relevantes de game.js (con nombre y propósito)
                 que probablemente haya que tocar.
               - Riesgos o casos límite a considerar.
               - Una sugerencia inicial de enfoque para la solución (sin implementarla).
               Este diagnóstico es para ayudar a quien implemente la solución después,
               no reemplaza el análisis final.

            Si el issue ya tiene un comentario de diagnóstico tuyo previo (por ser una
            edición), actualiza el análisis en un nuevo comentario en vez de duplicar
            trabajo innecesario, y ajusta las labels si el contenido editado lo justifica.
          claude_args: '--allowedTools "Bash(gh label list:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh issue view:*)"'
